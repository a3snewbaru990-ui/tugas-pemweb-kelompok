<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Account - SH-STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-repeat: no-repeat; background-size: cover; background-position: center;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .custom-navbar {
            background: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(10px); padding: 12px 20px;
        }
        .custom-navbar .navbar-brand { letter-spacing: 3px; font-weight: 800; }
        .custom-navbar .nav-link { color: #fff !important; margin-left: 10px; transition: 0.3s; }
        .custom-navbar .nav-link:hover, .custom-navbar .nav-link.active { color: #d09cff !important; }

        /* Flexbox */
        .login-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 15px; width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }
        .login-box h2 { color: #fff; font-size: 32px; margin-bottom: 20px; letter-spacing: 2px; }
        .login-box input {
            width: 100%; padding: 12px 20px; margin: 10px 0; border: none;
            border-radius: 25px; background: rgba(255, 255, 255, 0.9); font-size: 14px; outline: none;
        }
        .login-links { margin-top: 20px; display: flex; justify-content: center; flex-wrap: wrap; }
        .login-links a { color: #ddd; font-size: 13px; text-decoration: none; }
        .login-links a:hover { color: #fff; text-decoration: underline; }

        footer {
            display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 10px;
            background: rgba(0,0,0,0.6); color: #ddd; padding: 15px; font-size: 14px;
        }

        /* Media query */
        @media (max-width: 768px) {
            .login-box { padding: 30px 20px; }
            .login-box h2 { font-size: 28px; }
        }
        @media (max-width: 576px) {
            .login-box { padding: 25px 15px; }
            .login-box h2 { font-size: 24px; }
            footer { font-size: 12px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html">SH-STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="kontak.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="Login.html">Sign In</a></li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a class="btn btn-light btn-sm px-3 rounded-pill active" href="buat.html">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <form class="login-box" action="Login.html">
            <h2>Register</h2>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold mt-3"
                style="background:linear-gradient(45deg,#8c00ff,#4a00e0);border:none;padding:12px;">Submit</button>
            <div class="login-links">
                <a href="Login.html">Already have an account? Login here</a>
            </div>
        </form>
    </div>

    <footer><span>&copy; 2026 SH-STORE</span><span>•</span><span>Register Page</span></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
